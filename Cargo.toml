[package]
name = "kika"
version = "0.7.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Robust 2D kernel for Rust: exact predicates, Delaunay triangulation, constrained Delaunay triangulation, and simple-polygon triangulation, with adaptive/exact fallback arithmetic. No CMake, no Boost, no GMP/MPFR, WASM-ready."
repository = "https://github.com/kent-tokyo/kika"
homepage = "https://github.com/kent-tokyo/kika"
documentation = "https://docs.rs/kika"
readme = "README.md"
keywords = ["geometry", "delaunay", "predicates", "triangulation", "cgal"]
categories = ["algorithms", "science", "mathematics", "wasm"]

[lib]
name = "kika"

[[bench]]
name = "sanity"
harness = false

[dependencies]

[dev-dependencies]
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.76"

[profile.release]
overflow-checks = true
