[package]
name = "kika"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Robust computational geometry for Rust: exact predicates with adaptive/exact fallback arithmetic. A pure-Rust alternative to CGAL — no CMake, no Boost, no GMP/MPFR, WASM-ready."
repository = "https://github.com/kent-tokyo/kika"
readme = "README.md"
keywords = ["geometry", "delaunay", "predicates", "robust", "cgal"]
categories = ["algorithms", "science", "mathematics", "wasm"]

[lib]
name = "kika"

[dependencies]

[dev-dependencies]
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"

[profile.release]
overflow-checks = true
